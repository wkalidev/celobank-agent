  <pattern id="hex" x="0" y="0" width="26" height="30" patternUnits="userSpaceOnUse">
    <polygon points="13,1 25,8 25,22 13,29 1,22 1,8" fill="none" stroke="#ffd700" stroke-width="0.3" opacity="0.05"/>
